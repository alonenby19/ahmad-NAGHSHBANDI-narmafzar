
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به حساب کاربری</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <div class="logo">
                <span>●</span>
            </div>

            <h1>خوش آمدید</h1>
            <p class="subtitle">برای ورود به حساب خود اطلاعات را وارد کنید.</p>

            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label for="email">آدرس ایمیل</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        autocomplete="username"
                    >
                    <small class="error-message" id="emailError"></small>
                </div>

                <div class="form-group">
                    <label for="password">رمز عبور</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            placeholder="رمز عبور خود را وارد کنید"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="نمایش رمز عبور"
                        >
                            نمایش
                        </button>
                    </div>

                    <small class="error-message" id="passwordError"></small>
                </div>

                <div class="form-options">
                    <label class="remember">
                        <input type="checkbox" id="rememberMe">
                        مرا به خاطر بسپار
                    </label>

                    <a href="#" class="forgot-link">فراموشی رمز؟</a>
                </div>

                <div id="formMessage" class="form-message" aria-live="polite"></div>

                <button type="submit" id="loginButton" class="login-button">
                    <span id="buttonText">ورود به حساب</span>
                    <span id="loader" class="loader"></span>
                </button>

            </form>

            <div class="register-link">
                حساب کاربری ندارید؟
                <a href="#">ثبت‌نام کنید</a>
            </div>

        </section>
    </main>

</body>
</html>
